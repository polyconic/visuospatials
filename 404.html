<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nothing here &mdash; Visuospatials</title>
    <link rel="icon" type="image/png" href="/faviconv.png">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="stylesheet" href="/base.css">
    <style>
        html, body { height: 100%; overflow: hidden; }
        body { display: grid; align-items: end; justify-items: center; }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
        .mid { position: relative; z-index: 3; text-align: center; padding: 20px 20px clamp(40px, 11vh, 90px); }
        .mid p { margin-bottom: 26px; line-height: 2; }
        .mid a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--rule);
                 padding-bottom: 2px; margin: 0 10px; transition: color 0.2s, border-color 0.2s; }
        .mid a:hover { color: var(--sig); border-color: var(--sig); }
        .mid .quiet { color: var(--faint); border: 0; }
        .mid .quiet:hover { color: var(--sig); }
    </style>
</head>
<body>
<a class="homemark" href="/" aria-label="Front page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4M11 5l-7 7 7 7"/></svg></a>
<a class="menumark" href="/" aria-label="Index" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><line class="a" x1="3" y1="7" x2="21" y2="7"/><line class="b" x1="3" y1="12" x2="21" y2="12"/><line class="c" x1="3" y1="17" x2="21" y2="17"/></svg></a>
<canvas id="c"></canvas>
<div class="mid">
    <p class="mono">There is no page at this address.<br>The dots know it too.</p>
    <p class="mono"><a href="/">Front</a><a href="/lab/">The lab</a><a href="/studio.html">Studio</a><a class="quiet" href="/void.html">&middot;</a></p>
</div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H, dpr, mask, cell = 14;

function build() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    if (W < 2 || H < 2) { mask = null; return; }
    c.width = W * dpr; c.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const m = document.createElement('canvas');
    m.width = W; m.height = H;
    const mc = m.getContext('2d');
    mc.fillStyle = '#000';
    mc.fillRect(0, 0, W, H);
    mc.fillStyle = '#fff';
    mc.textAlign = 'center';
    mc.textBaseline = 'middle';
    mc.font = `700 ${Math.min(W * 0.42, H * 0.56)}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
    mc.fillText('404', W / 2, H * 0.41);
    mask = mc.getImageData(0, 0, W, H).data;
}
function inMask(x, y) {
    const i = ((y | 0) * W + (x | 0)) * 4;
    return mask[i] > 128;
}

let mouse = { x: -9999, y: -9999 };
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

function loop() {
    if (!mask || W !== innerWidth || H !== innerHeight) build();
    if (!mask) { requestAnimationFrame(loop); return; }
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);
    for (let y = cell; y < H; y += cell) {
        for (let x = cell; x < W; x += cell) {
            const on = inMask(x, y);
            const d = Math.hypot(x - mouse.x, y - mouse.y);
            const push = Math.max(0, 1 - d / 190);
            const r = (on ? cell * 0.42 : cell * 0.07) + push * cell * 0.3;
            if (r < 0.3) continue;
            const a = Math.atan2(y - mouse.y, x - mouse.x);
            ctx.fillStyle = on ? '#f2f2ef' : '#2e2e2b';
            ctx.beginPath();
            ctx.arc(x + Math.cos(a) * push * 13, y + Math.sin(a) * push * 13, r, 0, 6.2832);
            ctx.fill();
        }
    }
    requestAnimationFrame(loop);
}

build();
loop();
</script>
<script src="/menu.js"></script>
</body>
</html>

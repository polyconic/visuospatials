<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        html, body { height: 100%; overflow: hidden; }
        body { display: grid; align-items: end; justify-items: center; }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
        .mid { position: relative; z-index: 3; text-align: center; padding: 20px 20px clamp(40px, 11vh, 90px); }
        .mid p { margin-bottom: 26px; line-height: 2; }
        .mid a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--rule);
                 padding-bottom: 2px; margin: 0 10px; transition: color 0.2s, border-color 0.2s; }
        .mid a:hover { color: var(--sig); border-color: var(--sig); }
    </style>
</head>
<body>
<div class="corner">
<a class="mailmark" href="mailto:gregor.art@pm.me?subject=Visuospatials" aria-label="Email">
<svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M2 5H22V19H2ZM4 5H20L12 11.6Z"/></svg>
</a>
</div>
<a class="backmark" href="/" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12 12 4.5V19.5ZM12 10H21V14H12Z"/></svg></a>
<a class="homemark" href="/" aria-label="Front page"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 3 22 11.5H2ZM5 11.5H19V21H5ZM10.2 15H13.8V21H10.2Z"/></svg></a>
<canvas id="c"></canvas>
<div class="mid">
    <p class="label">There is no page at this address.<br>The pieces know it too.</p>
    <p class="label"><a href="/">Front</a><a href="/work">Work</a><a href="/studio">Studio/About</a></p>
    <p class="copy label">&copy; 2026 Visuospatials</p>
</div>

<script src="/geo.js"></script>
<script>
// The work page used to live at /work/; send old links to its new address.
if (/^\/work\/(index\.html)?$/.test(location.pathname)) location.replace('/work');
// The 404 in the same pieces as the wordmark, coming together every 16s.
Geo.converge(document.getElementById('c'), '404', width => {
    const s = Math.min(innerWidth * 0.62 / width, innerHeight * 0.4);
    return { x: (innerWidth - width * s) / 2, y: innerHeight * 0.41 - s / 2, s };
}, { cycle: 16 });
</script>
<script src="/nav.js"></script>
</body>

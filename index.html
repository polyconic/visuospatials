    <style>
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        .flicker-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--sans);
            font-size: clamp(16px, 7vw, 160px);
            letter-spacing: 0.25em;
            color: #5c5c58;
            font-weight: 700;
            text-transform: uppercase;
            user-select: none;
            z-index: 10;
            white-space: nowrap;
            text-decoration: none;
            cursor: pointer;
            /* A taller hit area than the letters, so it's an easy tap on a phone. */
            padding: 0.4em 0;
        }
        /* The shapes draw the wordmark; the text stays as the link's hit area and for readers. */
        .flicker-text.drawn { color: transparent; }

        .geo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        body { user-select: none; -webkit-touch-callout: none; }


        .pin {
            position: fixed;
            right: 14px;
            bottom: 12px;
            z-index: 30;
            width: 20px;
            height: 20px;
            display: grid;
            place-items: center;
            color: var(--fg);
            opacity: 0.07;
            text-decoration: none;
            font-family: var(--sans);
            font-size: 14px;
            transition: opacity 0.5s, color 0.3s;
        }
        .pin:hover, .pin:focus-visible { opacity: 1; color: var(--sig); }

        html.inverted { filter: invert(1) hue-rotate(180deg); }
    </style>

<body>
<div class="corner">
<a class="mailmark" href="mailto:gregor.art@pm.me?subject=Visuospatials" aria-label="Email">
<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="1.5"/><path d="M3 6.5l9 6.5 9-6.5"/></svg>

    <a class="flicker-text" href="/studio.html" aria-label="Visuospatials">VISUOSPATIALS</a>
    <canvas class="geo" id="geo" aria-hidden="true"></canvas>


    <a class="pin" href="lab/" aria-label="Index" title="Index">&#9679;</a>


    <script>
        const container = document.querySelector('.flicker-text');
        const WORD = container.textContent;

        /* The wordmark is built from flat shapes. Each piece slides left at its own
           speed (1, 2 or 3 laps a cycle) and wraps, so they only line up into the
           word once a cycle; time slows around that moment so the word holds.
           Under reduced motion the word is drawn once, assembled. */
        const MOVING = !matchMedia('(prefers-reduced-motion: reduce)').matches;
        const INK = '#f2f2ef';
        const CYCLE = 26;

        // Hairline geometry in a 1-unit-tall box: bars, slanted strokes and ring
        // slices, one stroke weight throughout. w is the advance.
        const T = 0.085;
        const R = (1 - T) / 4 + T / 2; // S bowls meet on one shared band
        const bar = (x, y, w, h) => ['rect', [x, y, w, h]];
        const ring = (x, y, r, a0, a1) => ['ring', [x, y, r, r - T, a0, a1]];
        // Two slanted strokes meeting at the bottom; t is the stroke weight.
        const vee = t => {
            const h = t * 0.575; // half a slanted stroke's horizontal width
            return [['poly', [0, 0, 2 * h, 0, 0.35 + h, 1, 0.35 - h, 1]], ['poly', [0.7 - 2 * h, 0, 0.7, 0, 0.35 + h, 1, 0.35 - h, 1]]];
        };
        const flip = parts => parts.map(([k, a]) => [k, a.map((v, i) => i % 2 ? 1 - v : v)]);
        const PI = Math.PI;
        const GLYPHS = {
            // Measured identical, a V still reads lighter than its flipped A, so its
            // strokes carry a little extra weight to look the same.
            V: { w: 0.7, parts: vee(T * 1.14) },
            A: { w: 0.7, parts: flip(vee(T)) },
            I: { w: T, parts: [bar(0, 0, T, 1)] },
            S: { w: 2 * R, parts: [ring(R, R, R, PI / 2, PI * 1.5), ring(R, 1 - R, R, -PI / 2, PI / 2)] },
            U: { w: 0.6, parts: [bar(0, 0, T, 0.7), bar(0.6 - T, 0, T, 0.7), ring(0.3, 0.7, 0.3, 0, PI)] },
            O: { w: 1, parts: [ring(0.5, 0.5, 0.5, 0, PI * 2)] },
            P: { w: T + 0.28, parts: [bar(0, 0, T, 1), ring(T, 0.28, 0.28, -PI / 2, PI / 2)] },
            T: { w: 0.6, parts: [bar(0, 0, 0.6, T), bar(0.3 - T / 2, 0, T, 1)] },
            L: { w: 0.48, parts: [bar(0, 0, T, 1), bar(0, 1 - T, 0.48, T)] },
        };
        const GAP = 0.22;

        const canvas = document.getElementById('geo');
        const cx = canvas.getContext('2d');
        let W = 0, H = 0, pieces = [];
        let blastAt = -1e9;

        function trace(kind, a, s, ox, oy) {
            cx.beginPath();
            if (kind === 'rect') cx.rect(ox + a[0] * s, oy + a[1] * s, a[2] * s, a[3] * s);
            if (kind === 'poly') { for (let i = 0; i < a.length; i += 2) cx.lineTo(ox + a[i] * s, oy + a[i + 1] * s); cx.closePath(); }
            if (kind === 'ring') { cx.arc(ox + a[0] * s, oy + a[1] * s, a[2] * s, a[4], a[5]); cx.arc(ox + a[0] * s, oy + a[1] * s, a[3] * s, a[5], a[4], true); cx.closePath(); }
        }

        function build() {
            W = innerWidth; H = innerHeight;
            if (W < 2 || H < 2) { pieces = []; return; }
            const dpr = Math.min(3, devicePixelRatio || 1);
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            cx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // Sized to the link's text, so the clickable box and the drawn word match.
            const units = [...WORD].reduce((a, ch) => a + GLYPHS[ch].w, 0) + GAP * (WORD.length - 1);
            const s = Math.min(container.getBoundingClientRect().width / units, H * 0.16);
            let x = (W - units * s) / 2;
            const y = (H - s) / 2;
            let seed = 11;
            const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
            pieces = [];
            [...WORD].forEach(ch => {
                const g = GLYPHS[ch];
                g.parts.forEach(p => {
                    const a = Math.random() * 6.2832, d = 200 + Math.random() * 400;
                    pieces.push({ kind: p[0], a: p[1], s, ax: x, ay: y, laps: 1 + Math.floor(rnd() * 3),
                                  bx: Math.cos(a) * d, by: Math.sin(a) * d });
                });
                x += (g.w + GAP) * s;
            });
        }

        function draw(p, ox, oy) {
            trace(p.kind, p.a, p.s, ox, oy);
            cx.fill();
        }

        // Blows out over 6s and settles back over 2.5s.
        function blast() {
            const t = (performance.now() - blastAt) / 1000;
            if (t < 0 || t > 8.5) return 0;
            if (t < 6) { const k = t / 6; return k * k * (3 - 2 * k); }
            const k = 1 - (t - 6) / 2.5;
            return k * k * k;
        }

        function render(sec) {
            if (!pieces.length || W !== innerWidth || H !== innerHeight) build();
            if (!pieces.length) return;
            cx.clearRect(0, 0, W, H);
            const f = sec / CYCLE - Math.floor(sec / CYCLE);
            const warped = f - 0.94 * Math.sin(2 * Math.PI * f) / (2 * Math.PI);
            const margin = pieces[0].s * 1.2, span = W + 2 * margin;
            const b = blast();
            cx.globalAlpha = 1 - b;
            cx.fillStyle = INK;
            pieces.forEach(q => {
                let x = q.ax - q.laps * span * warped;
                x = ((x + margin) % span + span) % span - margin;
                draw(q, x + q.bx * b, q.ay + q.by * b);
            });
        }

        function loop(ms) {
            render(ms / 1000);
            requestAnimationFrame(loop);
        }

        // Only reachable by typing "spatial"; nothing runs this on a timer.
        function explode() {
            blastAt = performance.now();
            if (!MOVING) requestAnimationFrame(function settle() {
                render(0);
                if (blast() > 0) requestAnimationFrame(settle);
            });
        }

        container.classList.add('drawn');
        if (MOVING) requestAnimationFrame(loop);
        else { render(0); addEventListener('resize', () => render(0)); }


        const konami = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
        let konamiAt = 0;
        let typed = '';

        document.addEventListener('keydown', e => {
            konamiAt = (e.key === konami[konamiAt] || e.key.toLowerCase() === konami[konamiAt]) ? konamiAt + 1 : 0;
            if (konamiAt === konami.length) {
                konamiAt = 0;
                document.documentElement.classList.toggle('inverted');
            }

            if (e.key.length === 1) {
                typed = (typed + e.key.toLowerCase()).slice(-9);
                if (typed.endsWith('lab')) location.href = 'lab/';
                if (typed.endsWith('spatial')) explode();
            }
        });

        console.log('%cVISUOSPATIALS', 'font: 700 42px/1 Helvetica Neue, Arial; color:#ff2d00');
        console.log('%cclick the name. or type: lab / spatial', 'font: 12px/1.6 monospace; color:#787874');
    </script>
</body>

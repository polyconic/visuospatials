<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visuospatials</title>
    <link rel="icon" type="image/png" href="faviconv.png">
    <link rel="canonical" href="https://visuospatials.com/">
    <meta name="description" content="Visuospatials — a design and artwork studio. Rooms, tools and printed matter.">
    <meta name="theme-color" content="#0a0a0a">
    <meta property="og:title" content="Visuospatials">
    <meta property="og:description" content="A design and artwork studio. Rooms, tools and printed matter.">
    <meta property="og:image" content="https://visuospatials.com/blur.webp">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://visuospatials.com/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="base.css">
    <style>
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        img {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            position: relative;
            z-index: 0;
            animation: drift 90s ease-in-out infinite alternate;
        }
        @keyframes drift {
            from { transform: scale(1.04) translate(0.4%, -0.4%); }
            to   { transform: scale(1.11) translate(-0.8%, 0.6%); }
        }
        .flicker-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--sans);
            font-size: clamp(16px, 7vw, 160px);
            letter-spacing: 0.25em;
            color: #5c5c58;
            font-weight: 700;
            text-transform: uppercase;
            user-select: none;
            z-index: 10;
            white-space: nowrap;
            cursor: default;
        }
        .flicker-text span { display: inline-block; }

        body { user-select: none; -webkit-touch-callout: none; }

        /* Follows the pointer and closes on itself while held. */
        .hold {
            position: fixed;
            z-index: 40;
            width: 102px;
            height: 102px;
            margin: -51px 0 0 -51px;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.72);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .hold.on { opacity: 1; transform: scale(1); }
        .hold circle { fill: none; stroke-width: 3; }
        .hold .track { stroke: rgba(255, 255, 255, 0.34); }
        .hold .sweep { stroke: var(--sig); stroke-linecap: round;
                       transform: rotate(-90deg); transform-origin: 50% 50%; }
        .hold .core { fill: var(--sig); stroke: none; }

        .whisper {
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            opacity: 0;
            transition: opacity 3s ease;
            text-align: center;
        }
        .whisper.on { opacity: 0.55; }

        .cross { width: 76px; height: 76px; }

        .pin {
            position: fixed;
            right: 14px;
            bottom: 12px;
            z-index: 30;
            width: 20px;
            height: 20px;
            display: grid;
            place-items: center;
            color: var(--fg);
            opacity: 0.07;
            text-decoration: none;
            font-family: var(--sans);
            font-size: 14px;
            transition: opacity 0.5s, color 0.3s;
        }
        .pin:hover, .pin:focus-visible { opacity: 1; color: var(--sig); }

        html.inverted { filter: invert(1) hue-rotate(180deg); }
    </style>
    <!-- Must stay in <head>: moving it later reintroduces the theme flash. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("vs-theme") === "light")
            document.documentElement.classList.add("light");
        } catch (e) {}
      })();
    </script>
</head>
<body>
<div class="corner">
<button class="themetoggle" type="button" aria-label="Switch to light" aria-pressed="false">
<svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
<svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<a class="mailmark" href="mailto:gregor.art@pm.me?subject=Visuospatials" aria-label="Email">
<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="1.5"/><path d="M3 6.5l9 6.5 9-6.5"/></svg>
</a>
</div>
    <img src="blur.webp" alt="Visuospatials">
    <span class="flicker-text">VISUOSPATIALS</span>

    <svg class="hold" id="hold" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="46"></circle>
        <circle class="sweep" cx="50" cy="50" r="46"></circle>
        <circle class="core" cx="50" cy="50" r="3"></circle>
    </svg>

    <p class="whisper label" id="whisper">hold anywhere</p>

    <a class="cross" data-corner href="void.html" aria-label="Room 00"><canvas></canvas></a>

    <a class="pin" href="lab/" aria-label="Index" title="Index">&#9679;</a>


    <script src="/cross.js"></script>
    <script src="/menu.js"></script>
<script src="/theme.js"></script>
    <script>
        const container = document.querySelector('.flicker-text');

        const letters = container.textContent.split('');
        container.textContent = '';
        letters.forEach(char => {
            const span = document.createElement('span');
            span.textContent = char;
            container.appendChild(span);
        });

        // Only reachable by typing "spatial"; nothing runs this on a timer.
        function explode() {
            const spans = container.querySelectorAll('span');

            // Slow explosion over 6 seconds
            spans.forEach(span => {
                const angle = Math.random() * 2 * Math.PI;
                const dist = 200 + Math.random() * 400;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;
                span.style.transition = 'transform 6s ease-in-out, opacity 6s ease-in-out';
                span.style.transform = `translate(${x}px, ${y}px)`;
                span.style.opacity = '0';
            });

            // Rebound back
            setTimeout(() => {
                spans.forEach(span => {
                    span.style.transition = 'transform 2.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2s ease-out';
                    span.style.transform = '';
                    span.style.opacity = '';
                });
            }, 6000);
        }

        const hold = document.getElementById('hold');
        const sweep = hold.querySelector('.sweep');
        const whisper = document.getElementById('whisper');
        const CIRC = 2 * Math.PI * 46;
        let holdTimer = null;

        sweep.style.strokeDasharray = CIRC;
        sweep.style.strokeDashoffset = CIRC;

        function startHold(e) {
            if (VSMenu.isOpen()) return;
            if (e.target instanceof Element && e.target.closest('a')) return;
            hold.style.left = e.clientX + 'px';
            hold.style.top = e.clientY + 'px';
            hold.classList.add('on');
            sweep.style.transition = 'none';
            sweep.style.strokeDashoffset = CIRC;
            void sweep.getBoundingClientRect();
            sweep.style.transition = 'stroke-dashoffset 1.1s linear';
            sweep.style.strokeDashoffset = '0';
            holdTimer = setTimeout(() => { cancelHold(); VSMenu.open(); }, 1100);
        }
        function cancelHold() {
            clearTimeout(holdTimer);
            hold.classList.remove('on');
            sweep.style.transition = 'stroke-dashoffset 0.25s ease-out';
            sweep.style.strokeDashoffset = CIRC;
        }

        document.addEventListener('pointerdown', startHold);
        document.addEventListener('pointerup', cancelHold);
        document.addEventListener('pointercancel', cancelHold);
        document.addEventListener('pointerleave', cancelHold);
        // Long-press on the photo would otherwise raise the save-image callout.
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Nobody should be trapped by a gesture they cannot perform.
        setTimeout(() => whisper.classList.add('on'), 24000);

        const konami = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
        let konamiAt = 0;
        let typed = '';

        document.addEventListener('keydown', e => {
            konamiAt = (e.key === konami[konamiAt] || e.key.toLowerCase() === konami[konamiAt]) ? konamiAt + 1 : 0;
            if (konamiAt === konami.length) {
                konamiAt = 0;
                document.documentElement.classList.toggle('inverted');
            }

            if (e.key.length === 1) {
                typed = (typed + e.key.toLowerCase()).slice(-9);
                if (typed.endsWith('lab')) location.href = 'lab/';
                if (typed.endsWith('void')) location.href = 'void.html';
                if (typed.endsWith('spatial')) explode();
            }
        });

        console.log('%cVISUOSPATIALS', 'font: 700 42px/1 Helvetica Neue, Arial; color:#ff2d00');
        console.log('%cthere are six rooms and one that is not counted.\nhold anywhere. or type: lab / void / spatial', 'font: 12px/1.6 monospace; color:#787874');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="faviconv.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visuospatials</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        img {
    width: 100%;
    height: 100vh;
    object-fit: cover;
    position: relative;
    z-index: 0;
        }
        .flicker-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: clamp(18px, 4vw, 48px);
            letter-spacing: 0.25em;
            color: rgba(255, 255, 255, 0.10);
            font-weight: 300;
            text-transform: uppercase;
            animation: flicker 2s infinite;
            user-select: none;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }
        @keyframes flicker {
            0%   { opacity: 0.10; }
            4%   { opacity: 0.05; }
            6%   { opacity: 0.09; }
            8%   { opacity: 0.05; }
            10%  { opacity: 0.10; }
            14%  { opacity: 0.08; }
            20%  { opacity: 0.05; }
            22%  { opacity: 0.10; }
            36%  { opacity: 0.10; }
            38%  { opacity: 0.05; }
            40%  { opacity: 0.09; }
            43%  { opacity: 0.10; }
            70%  { opacity: 0.10; }
            72%  { opacity: 0.05; }
            73%  { opacity: 0.07; }
            74%  { opacity: 0.05; }
            76%  { opacity: 0.10; }
            100% { opacity: 0.10; }
        }
    </style>
</head>
<body>
    <img src="visuo.png" alt="Visuospatials">
    <span class="flicker-text">VISUOSPATIALS</span>
</body>
</html>

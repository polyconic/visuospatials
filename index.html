<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="faviconv.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visuospatials</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        img {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            position: relative;
            z-index: 0;
        }
        .flicker-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: clamp(48px, 10vw, 160px);
            letter-spacing: 0.25em;
            color: #fff;
            font-weight: 700;
            text-transform: uppercase;
            user-select: none;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }
        .flicker-text span {
            display: inline-block;
        }
    </style>
</head>
<body>
    <img src="visuo.png" alt="Visuospatials">
    <span class="flicker-text">VISUOSPATIALS</span>
    <script>
        const container = document.querySelector('.flicker-text');

        const letters = container.textContent.split('');
        container.textContent = '';
        letters.forEach(char => {
            const span = document.createElement('span');
            span.textContent = char;
            container.appendChild(span);
        });

        function explode() {
            const spans = container.querySelectorAll('span');

            // Slow explosion over 6 seconds
            spans.forEach(span => {
                const angle = Math.random() * 2 * Math.PI;
                const dist = 200 + Math.random() * 400;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;
                span.style.transition = 'transform 6s ease-in-out, opacity 6s ease-in-out';
                span.style.transform = `translate(${x}px, ${y}px)`;
                span.style.opacity = '0';
            });

            // Rebound back
            setTimeout(() => {
                spans.forEach(span => {
                    span.style.transition = 'transform 2.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2s ease-out';
                    span.style.transform = '';
                    span.style.opacity = '';
                });
            }, 6000);
        }

        setInterval(explode, 10000);
    </script>
</body>
</html>

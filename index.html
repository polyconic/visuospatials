<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visuospatials</title>
    <link rel="icon" type="image/png" href="faviconv.png">
    <link rel="canonical" href="https://visuospatials.com/">
    <meta name="description" content="Visuospatials — a design and artwork studio. Rooms, tools and printed matter.">
    <meta name="theme-color" content="#0a0a0a">
    <meta property="og:title" content="Visuospatials">
    <meta property="og:description" content="A design and artwork studio. Rooms, tools and printed matter.">
    <meta property="og:image" content="https://visuospatials.com/visuo.webp">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://visuospatials.com/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="base.css">
    <style>
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        img {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            position: relative;
            z-index: 0;
            animation: drift 90s ease-in-out infinite alternate;
        }
        @keyframes drift {
            from { transform: scale(1.04) translate(0.4%, -0.4%); }
            to   { transform: scale(1.11) translate(-0.8%, 0.6%); }
        }
        .flicker-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--sans);
            font-size: clamp(16px, 7vw, 160px);
            letter-spacing: 0.25em;
            color: #fff;
            font-weight: 700;
            text-transform: uppercase;
            user-select: none;
            z-index: 10;
            white-space: nowrap;
            cursor: default;
        }
        .flicker-text span { display: inline-block; }

        /* Grows under the wordmark while the pointer is held down. */
        .charge {
            position: absolute;
            top: calc(50% + 4.6vw);
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: var(--sig);
            z-index: 11;
            pointer-events: none;
        }
        .charge.on { width: 34vw; transition: width 1.1s linear; }

        .whisper {
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            opacity: 0;
            transition: opacity 3s ease;
            text-align: center;
        }
        .whisper.on { opacity: 0.55; }

        .pin {
            position: fixed;
            right: 14px;
            bottom: 12px;
            z-index: 30;
            width: 20px;
            height: 20px;
            display: grid;
            place-items: center;
            color: var(--fg);
            opacity: 0.07;
            text-decoration: none;
            font-family: var(--mono);
            font-size: 14px;
            transition: opacity 0.5s, color 0.3s;
        }
        .pin:hover, .pin:focus-visible { opacity: 1; color: var(--sig); }

        .index {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 6vh 7vw;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }
        .index.on { opacity: 1; pointer-events: auto; }
        .index h2 { font-size: 11px; letter-spacing: 0.3em; font-weight: 400; color: var(--dim);
                    text-transform: uppercase; font-family: var(--mono); margin-bottom: 5vh; }
        .index ol { list-style: none; }
        .index li { border-top: 1px solid var(--rule); }
        .index li:last-child { border-bottom: 1px solid var(--rule); }
        .index a {
            display: flex;
            align-items: baseline;
            gap: clamp(14px, 3vw, 46px);
            padding: clamp(10px, 1.8vh, 22px) 0;
            text-decoration: none;
            color: var(--fg);
            transition: color 0.2s, padding-left 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .index a:hover, .index a:focus-visible { color: var(--sig); padding-left: 18px; }
        .index .n { font-family: var(--mono); font-size: 11px; color: var(--dim); width: 2.4em; flex: none; }
        .index a:hover .n { color: var(--sig); }
        .index .t { font-size: clamp(22px, 5vw, 62px); font-weight: 700; letter-spacing: -0.02em;
                    text-transform: uppercase; line-height: 1; }
        .index .d { margin-left: auto; text-align: right; font-family: var(--mono); font-size: 10px;
                    letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
        @media (max-width: 620px) { .index .d { display: none; } }
        .index .close { margin-top: 5vh; font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
                        color: var(--dim); text-transform: uppercase; }

        html.inverted { filter: invert(1) hue-rotate(180deg); }
    </style>
</head>
<body>
    <img src="visuo.webp" alt="Visuospatials">
    <span class="flicker-text">VISUOSPATIALS</span>
    <div class="charge" id="charge"></div>

    <p class="whisper mono" id="whisper">hold the name down</p>

    <a class="pin" href="lab/" aria-label="Index" title="Index">&#9679;</a>

    <nav class="index" id="index" aria-hidden="true">
        <h2>Visuospatials &mdash; index</h2>
        <ol>
            <li><a href="lab/halftone.html"><span class="n">01</span><span class="t">Halftone</span><span class="d">Dot &middot; dither &middot; ascii</span></a></li>
            <li><a href="lab/moire.html"><span class="n">02</span><span class="t">Moir&eacute;</span><span class="d">Interference fields</span></a></li>
            <li><a href="lab/type.html"><span class="n">03</span><span class="t">Type</span><span class="d">Kinetic specimen</span></a></li>
            <li><a href="lab/poster.html"><span class="n">04</span><span class="t">Poster</span><span class="d">Generative grid</span></a></li>
            <li><a href="lab/"><span class="n">05</span><span class="t">The Lab</span><span class="d">All rooms</span></a></li>
            <li><a href="studio.html"><span class="n">06</span><span class="t">Studio</span><span class="d">Who this is for</span></a></li>
        </ol>
        <p class="close">Esc to close &middot; there is more than this</p>
    </nav>

    <script>
        const container = document.querySelector('.flicker-text');

        const letters = container.textContent.split('');
        container.textContent = '';
        letters.forEach(char => {
            const span = document.createElement('span');
            span.textContent = char;
            container.appendChild(span);
        });

        function explode() {
            const spans = container.querySelectorAll('span');

            // Slow explosion over 6 seconds
            spans.forEach(span => {
                const angle = Math.random() * 2 * Math.PI;
                const dist = 200 + Math.random() * 400;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;
                span.style.transition = 'transform 6s ease-in-out, opacity 6s ease-in-out';
                span.style.transform = `translate(${x}px, ${y}px)`;
                span.style.opacity = '0';
            });

            // Rebound back
            setTimeout(() => {
                spans.forEach(span => {
                    span.style.transition = 'transform 2.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2s ease-out';
                    span.style.transform = '';
                    span.style.opacity = '';
                });
            }, 6000);
        }

        setInterval(explode, 10000);

        const index = document.getElementById('index');
        const charge = document.getElementById('charge');
        const whisper = document.getElementById('whisper');
        let holdTimer = null;

        function openIndex() {
            index.classList.add('on');
            index.setAttribute('aria-hidden', 'false');
            index.querySelector('a').focus();
        }
        function closeIndex() {
            index.classList.remove('on');
            index.setAttribute('aria-hidden', 'true');
        }
        function startHold() {
            charge.classList.add('on');
            holdTimer = setTimeout(() => { charge.classList.remove('on'); openIndex(); }, 1100);
        }
        function cancelHold() {
            clearTimeout(holdTimer);
            charge.classList.remove('on');
        }

        container.addEventListener('pointerdown', startHold);
        container.addEventListener('pointerup', cancelHold);
        container.addEventListener('pointerleave', cancelHold);
        container.addEventListener('pointercancel', cancelHold);
        container.addEventListener('contextmenu', e => e.preventDefault());

        // Nobody should be trapped by a gesture they cannot perform.
        setTimeout(() => whisper.classList.add('on'), 24000);

        const konami = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
        let konamiAt = 0;
        let typed = '';

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { closeIndex(); return; }

            konamiAt = (e.key === konami[konamiAt] || e.key.toLowerCase() === konami[konamiAt]) ? konamiAt + 1 : 0;
            if (konamiAt === konami.length) {
                konamiAt = 0;
                document.documentElement.classList.toggle('inverted');
            }

            if (e.key.length === 1) {
                typed = (typed + e.key.toLowerCase()).slice(-9);
                if (typed.endsWith('lab')) location.href = 'lab/';
                if (typed.endsWith('void')) location.href = 'void.html';
                if (typed.endsWith('spatial')) explode();
            }
        });

        console.log('%cVISUOSPATIALS', 'font: 700 42px/1 Helvetica Neue, Arial; color:#ff2d00');
        console.log('%cthere are six rooms and one that is not counted.\nhold the name. or type: lab / void / spatial', 'font: 12px/1.6 monospace; color:#787874');
    </script>
</body>
</html>

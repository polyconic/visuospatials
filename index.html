    <style>
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        img {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            position: relative;
            z-index: 0;
            animation: drift 90s ease-in-out infinite alternate;
            /* iOS shrinks an image under a long press to preview it, and taking
               over that gesture cancels the hold. Touches go to the page instead. */
            pointer-events: none;
            -webkit-user-drag: none;
        }
        @keyframes drift {
            from { transform: scale(1.04) translate(0.4%, -0.4%); }
            to   { transform: scale(1.11) translate(-0.8%, 0.6%); }
        }
        .flicker-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--sans);
            font-size: clamp(16px, 7vw, 160px);
            letter-spacing: 0.25em;
            color: #5c5c58;
            font-weight: 700;
            text-transform: uppercase;
            user-select: none;
            z-index: 10;
            white-space: nowrap;
            cursor: default;
        }
        .flicker-text span { display: inline-block; }
        /* The dot field draws the wordmark instead; the text stays for readers. */
        .flicker-text.dotted { opacity: 0; }

        .dots {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        body { user-select: none; -webkit-touch-callout: none; }
        /* Every touch here is the hold or the dots; a pan or pinch would cancel both. */
        html, body { touch-action: none; }

        /* Follows the pointer and closes on itself while held. */
        .hold {
            position: fixed;
            z-index: 40;
            width: 102px;
            height: 102px;
            margin: -51px 0 0 -51px;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.72);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .hold.on { opacity: 1; transform: scale(1); }
        .hold circle { fill: none; stroke-width: 3; }
        .hold .track { stroke: rgba(255, 255, 255, 0.34); }
        .hold .sweep { stroke: var(--sig); stroke-linecap: round;
                       transform: rotate(-90deg); transform-origin: 50% 50%; }
        .hold .core { fill: var(--sig); stroke: none; }

        .whisper {
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            opacity: 0;
            transition: opacity 3s ease;
            text-align: center;
        }
        .whisper.on { opacity: 0.55; }


        .pin {
            position: fixed;
            right: 14px;
            bottom: 12px;
            z-index: 30;
            width: 20px;
            height: 20px;
            display: grid;
            place-items: center;
            color: var(--fg);
            opacity: 0.07;
            text-decoration: none;
            font-family: var(--sans);
            font-size: 14px;
            transition: opacity 0.5s, color 0.3s;
        }
        .pin:hover, .pin:focus-visible { opacity: 1; color: var(--sig); }

        html.inverted { filter: invert(1) hue-rotate(180deg); }
    </style>
    <!-- Must stay in <head>: moving it later reintroduces the theme flash. -->

      })();

<body>
<div class="corner">
<a class="mailmark" href="mailto:gregor.art@pm.me?subject=Visuospatials" aria-label="Email">
<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="1.5"/><path d="M3 6.5l9 6.5 9-6.5"/></svg>
</a>
</div>
    <img src="blur.webp" alt="Visuospatials">
    <span class="flicker-text">VISUOSPATIALS</span>
    <canvas class="dots" id="dots" aria-hidden="true"></canvas>

    <svg class="hold" id="hold" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="46"></circle>
        <circle class="sweep" cx="50" cy="50" r="46"></circle>
        <circle class="core" cx="50" cy="50" r="3"></circle>
    </svg>

    <p class="whisper label" id="whisper">hold anywhere</p>

    <a class="pin" href="lab/" aria-label="Index" title="Index">&#9679;</a>


    <script>
        const container = document.querySelector('.flicker-text');
        const MARK = '#5c5c58';

        const WORD = container.textContent;
        const letters = WORD.split('');
        container.textContent = '';
        letters.forEach(char => {
            const span = document.createElement('span');
            span.textContent = char;
            container.appendChild(span);
        });

        /* The wordmark as a dot field, the same trick as the 404: draw the type
           into an offscreen canvas, read the pixels, and keep a dot wherever the
           letterforms landed. The pointer pushes them aside; on touch, a finger
           does. Under reduced motion the plain text stays and explode() moves
           the spans instead. */
        const DOTTED = !matchMedia('(prefers-reduced-motion: reduce)').matches;

        const canvas = document.getElementById('dots');
        const cx = canvas.getContext('2d');
        const mouse = { x: -9999, y: -9999 };
        let W = 0, H = 0, cell = 6, reach = 170, shove = 15, dots = [];
        let blastAt = -1e9;
        const ROWS = 11;

        function build() {
            W = innerWidth; H = innerHeight;
            if (W < 2 || H < 2) { dots = []; return; }
            const dpr = Math.min(3, devicePixelRatio || 1);
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            cx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // The span owns the type; read it back rather than repeating the clamp.
            const cs = getComputedStyle(container);
            const size = parseFloat(cs.fontSize);
            const track = parseFloat(cs.letterSpacing) || 0;
            const font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
            // Proportional to the type, so the disturbance covers the same
            // couple of letters whatever the viewport resolves the clamp to.
            reach = size * 2.6;
            shove = size * 0.24;

            const probe = document.createElement('canvas').getContext('2d');
            probe.font = font;
            const widths = letters.map(ch => probe.measureText(ch).width);
            const total = widths.reduce((a, b) => a + b, 0) + track * letters.length;
            const cap = probe.measureText('H').actualBoundingBoxAscent;

            /* The grid is locked to the type, not the window. Cap height is a
               whole number of rows, so every letter shares one top line and one
               baseline; each letter starts on a column, so repeated letters (two
               S, two A, two I) come out dot-for-dot identical. Without this the
               grid phase drifts across the word and stems wobble between widths. */
            cell = cap / ROWS;
            const ox = Math.round(((W - total) / 2) / cell) * cell - 2 * cell;
            const oy = Math.round((H / 2 - cap / 2) / cell) * cell - 2 * cell;
            const cols = Math.ceil(total / cell) + 4;
            const rows = ROWS + 4;

            // Drawn at 4x and judged by how much of each cell is ink, not by
            // one sample pixel, so edges fall the same way on every letter.
            const SS = 4;
            const m = document.createElement('canvas');
            m.width = Math.ceil(cols * cell * SS);
            m.height = Math.ceil(rows * cell * SS);
            const mc = m.getContext('2d', { willReadFrequently: true });
            mc.setTransform(SS, 0, 0, SS, 0, 0);
            mc.font = font;
            mc.fillStyle = '#fff';
            let x = (W - total) / 2;
            letters.forEach((ch, i) => {
                const snapped = Math.round((x - ox) / cell) * cell;
                mc.fillText(ch, snapped, 2 * cell + cap);
                x += widths[i] + track;
            });

            const px = mc.getImageData(0, 0, m.width, m.height).data;
            const step = cell * SS;
            dots = [];
            for (let r = 0; r < rows; r++) {
                const y0 = Math.round(r * step), y1 = Math.round((r + 1) * step);
                for (let c = 0; c < cols; c++) {
                    const x0 = Math.round(c * step), x1 = Math.round((c + 1) * step);
                    let ink = 0;
                    for (let yy = y0; yy < y1; yy++)
                        for (let xx = x0; xx < x1; xx++) ink += px[(yy * m.width + xx) * 4 + 3];
                    if (ink / ((y1 - y0) * (x1 - x0) * 255) < 0.5) continue;
                    const a = Math.random() * 6.2832;
                    const d = 200 + Math.random() * 400;
                    dots.push({ x: ox + (c + 0.5) * cell, y: oy + (r + 0.5) * cell,
                                bx: Math.cos(a) * d, by: Math.sin(a) * d });
                }
            }
        }

        // Blows out over 6s and settles back over 2.5s, as the letters used to.
        function blast() {
            const t = (performance.now() - blastAt) / 1000;
            if (t < 0 || t > 8.5) return 0;
            if (t < 6) { const k = t / 6; return k * k * (3 - 2 * k); }
            const k = 1 - (t - 6) / 2.5;
            return k * k * k;
        }

        function loop() {
            if (!dots.length || W !== innerWidth || H !== innerHeight) build();
            cx.clearRect(0, 0, W, H);

            const b = blast();
            cx.globalAlpha = 1 - b;
            cx.fillStyle = MARK;

            for (let i = 0; i < dots.length; i++) {
                const d = dots[i];
                const ox = d.x - mouse.x, oy = d.y - mouse.y;
                const push = Math.max(0, 1 - Math.hypot(ox, oy) / reach);
                const a = Math.atan2(oy, ox);
                cx.beginPath();
                cx.arc(d.x + Math.cos(a) * push * shove + d.bx * b,
                       d.y + Math.sin(a) * push * shove + d.by * b,
                       cell * 0.40 + push * cell * 0.3, 0, 6.2832);
                cx.fill();
            }
            requestAnimationFrame(loop);
        }

        // Only reachable by typing "spatial"; nothing runs this on a timer.
        function explode() {
            if (DOTTED) { blastAt = performance.now(); return; }

            const spans = container.querySelectorAll('span');

            // Slow explosion over 6 seconds
            spans.forEach(span => {
                const angle = Math.random() * 2 * Math.PI;
                const dist = 200 + Math.random() * 400;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;
                span.style.transition = 'transform 6s ease-in-out, opacity 6s ease-in-out';
                span.style.transform = `translate(${x}px, ${y}px)`;
                span.style.opacity = '0';
            });

            // Rebound back
            setTimeout(() => {
                spans.forEach(span => {
                    span.style.transition = 'transform 2.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2s ease-out';
                    span.style.transform = '';
                    span.style.opacity = '';
                });
            }, 6000);
        }

        if (DOTTED) {
            container.classList.add('dotted');
            const aim = e => { mouse.x = e.clientX; mouse.y = e.clientY; };
            const drop = () => { mouse.x = mouse.y = -9999; };
            addEventListener('pointermove', aim);
            addEventListener('pointerdown', aim);
            addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') drop(); });
            addEventListener('pointercancel', drop);
            addEventListener('pointerout', e => { if (!e.relatedTarget) drop(); });
            build();
            loop();
        } else {
            canvas.remove();
        }

        const hold = document.getElementById('hold');
        const sweep = hold.querySelector('.sweep');
        const whisper = document.getElementById('whisper');
        const CIRC = 2 * Math.PI * 46;
        let holdTimer = null;
        let holdFrom = null;

        sweep.style.strokeDasharray = CIRC;
        sweep.style.strokeDashoffset = CIRC;

        function startHold(e) {
            if (e.target instanceof Element && e.target.closest('a')) return;
            hold.style.left = e.clientX + 'px';
            hold.style.top = e.clientY + 'px';
            hold.classList.add('on');
            holdFrom = { x: e.clientX, y: e.clientY, touch: e.pointerType !== 'mouse' };
            sweep.style.transition = 'none';
            sweep.style.strokeDashoffset = CIRC;
            void sweep.getBoundingClientRect();
            sweep.style.transition = 'stroke-dashoffset 1.1s linear';
            sweep.style.strokeDashoffset = '0';
            holdTimer = setTimeout(() => { cancelHold(); location.href = '/studio.html'; }, 1100);
        }
        function cancelHold() {
            clearTimeout(holdTimer);
            holdFrom = null;
            hold.classList.remove('on');
            sweep.style.transition = 'stroke-dashoffset 0.25s ease-out';
            sweep.style.strokeDashoffset = CIRC;
        }

        document.addEventListener('pointerdown', startHold);
        // On touch, dragging plays with the dots; only a still finger goes in.
        document.addEventListener('pointermove', e => {
            if (holdFrom && holdFrom.touch &&
                Math.hypot(e.clientX - holdFrom.x, e.clientY - holdFrom.y) > 14) cancelHold();
        });
        document.addEventListener('pointerup', cancelHold);
        document.addEventListener('pointercancel', cancelHold);
        document.addEventListener('pointerleave', cancelHold);
        // Long-press on the photo would otherwise raise the save-image callout.
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Nobody should be trapped by a gesture they cannot perform.
        setTimeout(() => whisper.classList.add('on'), 24000);

        const konami = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
        let konamiAt = 0;
        let typed = '';

        document.addEventListener('keydown', e => {
            konamiAt = (e.key === konami[konamiAt] || e.key.toLowerCase() === konami[konamiAt]) ? konamiAt + 1 : 0;
            if (konamiAt === konami.length) {
                konamiAt = 0;
                document.documentElement.classList.toggle('inverted');
            }

            if (e.key.length === 1) {
                typed = (typed + e.key.toLowerCase()).slice(-9);
                if (typed.endsWith('lab')) location.href = 'lab/';
                if (typed.endsWith('spatial')) explode();
            }
        });

        console.log('%cVISUOSPATIALS', 'font: 700 42px/1 Helvetica Neue, Arial; color:#ff2d00');
        console.log('%chold anywhere. or type: lab / spatial', 'font: 12px/1.6 monospace; color:#787874');
    </script>
</body>

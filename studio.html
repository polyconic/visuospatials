<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio &mdash; Visuospatials</title>
    <link rel="icon" type="image/png" href="faviconv.png">
    <link rel="canonical" href="https://visuospatials.com/studio.html">
    <meta name="description" content="Visuospatials is a visual hub for design and artwork, within music, or any other medium.">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="stylesheet" href="base.css">
    <style>
        body { padding: clamp(30px, 8vh, 90px) clamp(20px, 7vw, 110px) 110px; }
        @media (max-width: 620px) { body { padding-top: 62px; padding-bottom: 150px; } }
        .wrap { max-width: 1180px; margin: 0 auto; }

        h1 { font-size: clamp(44px, 13vw, 190px); line-height: 0.8; letter-spacing: -0.05em;
             font-weight: 700; text-transform: uppercase; }
        h1 em { font-style: normal; color: var(--sig); }
        .lede { font-size: clamp(19px, 2.4vw, 30px); line-height: 1.45; letter-spacing: -0.01em;
                max-width: 24ch; margin: clamp(26px, 5vh, 54px) 0 clamp(40px, 9vh, 92px); }

        .call { border-top: 1px solid var(--rule); padding-top: clamp(34px, 7vh, 70px); }
        .call a.big { display: inline-block; font-size: clamp(26px, 6vw, 78px); font-weight: 700;
                letter-spacing: -0.035em; text-transform: uppercase; text-decoration: none;
                color: var(--fg); line-height: 1; transition: color 0.2s; }
        .call a.big:hover { color: var(--sig); }
        .call a.big::after { content: " \2197"; font-size: 0.5em; vertical-align: super; color: var(--sig); }
        .call p { margin-top: 20px; line-height: 1.9; }
        .call .links { margin-top: 26px; display: flex; gap: 26px; flex-wrap: wrap; }
        .call .links a { color: var(--dim); text-decoration: none; transition: color 0.2s; }
        .call .links a:hover { color: var(--fg); }
    </style>
    <!-- Must stay in <head>: moving it later reintroduces the theme flash. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("vs-theme") === "light")
            document.documentElement.classList.add("light");
        } catch (e) {}
      })();
    </script>
</head>
<body>
<div class="corner">
<button class="themetoggle" type="button" aria-label="Switch to light" aria-pressed="false">
<svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
<svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<a class="mailmark" href="mailto:gregor.art@pm.me?subject=Visuospatials" aria-label="Email">
<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="1.5"/><path d="M3 6.5l9 6.5 9-6.5"/></svg>
</a>
</div>
<a class="homemark" href="/" aria-label="Front page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4M11 5l-7 7 7 7"/></svg></a>
<a class="menumark" href="/" aria-label="Index" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><line class="a" x1="3" y1="7" x2="21" y2="7"/><line class="b" x1="3" y1="12" x2="21" y2="12"/><line class="c" x1="3" y1="17" x2="21" y2="17"/></svg></a>
<div class="wrap">
    <h1>Studio<em>.</em></h1>

    <p class="lede">Visuospatials is a visual hub for design and artwork, within music, or any other medium.</p>

    <div class="call">
        <a class="big" href="mailto:gregor.art@pm.me?subject=Visuospatials">Bring something</a>
        <p class="label">Send a link, a rough, a half-finished thing. Loose ideas are welcome; finished pitches less so.</p>
        <div class="links label">
            <a href="lab/">The lab</a>
            <a href="/">Front</a>
            <a href="https://gregoregan.com" rel="me">gregoregan.com</a>
        </div>
    </div>
</div>

<nav class="exit">
    <a href="/">Visuospatials</a><a href="lab/">Lab</a>
    <span class="here">Studio</span>
</nav>
<script src="/menu.js"></script>
<script src="/theme.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work &mdash; Visuospatials</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="canonical" href="https://visuospatials.com/work/">
    <meta name="description" content="Covers, motion and stills. Work made with and around music.">
    <meta name="theme-color" content="#0a0a0a">
    <meta property="og:title" content="Work — Visuospatials">
    <meta property="og:description" content="Covers, motion and stills. Work made with and around music.">
    <meta property="og:image" content="https://visuospatials.com/blur.webp">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://visuospatials.com/work/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="../base.css">
    <style>
        body { padding: clamp(28px, 6vh, 70px) clamp(20px, 6vw, 90px) 90px; }
        @media (max-width: 620px) { body { padding-top: 58px; padding-bottom: 140px; } }

        header { display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap;
                 padding-bottom: clamp(24px, 5vh, 54px); }
        h1 { font-size: clamp(40px, 12vw, 168px); line-height: 0.82; letter-spacing: -0.045em;
             font-weight: 700; text-transform: uppercase; }
        h1 em { font-style: normal; color: var(--sig);
                margin-left: calc(0.045em + 2px); }

        .tag { margin-top: clamp(22px, 4vh, 44px); }

        .grid { columns: 3; column-gap: clamp(14px, 2vw, 28px); }
        @media (max-width: 1000px) { .grid { columns: 2; } }
        @media (max-width: 620px)  { .grid { columns: 1; } }

        .piece { break-inside: avoid; margin: 0 0 clamp(14px, 2vw, 28px);
                 display: block; text-decoration: none; color: inherit;
                 background: none; border: 0; padding: 0; width: 100%;
                 text-align: left; font: inherit; cursor: pointer; }
        .piece .shot { position: relative; overflow: hidden; background: var(--rule); }
        .piece img, .piece video { display: block; width: 100%; height: auto;
                                   transition: opacity 0.4s, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .piece:hover img, .piece:hover video,
        .piece:focus-visible img, .piece:focus-visible video { transform: scale(1.02); }

        .cap { display: flex; gap: 12px; align-items: baseline;
               padding: 9px 1px 0; line-height: 1.5; }
        .cap .t { font-size: 12px; letter-spacing: 0.04em; color: var(--fg); }
        .cap .m { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
                  color: var(--dim); margin-left: auto; text-align: right; }

        .empty { max-width: 46ch; line-height: 2; }
        .empty a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--faint);
                   transition: border-color 0.2s; }
        .empty a:hover { border-color: var(--sig); }

        /* Viewer */
        .viewer { position: fixed; inset: 0; z-index: 400; background: var(--veil);
                  display: none; align-items: center; justify-content: center;
                  padding: clamp(40px, 7vh, 80px) clamp(16px, 5vw, 80px); }
        .viewer.on { display: flex; }
        .viewer figure { max-width: 100%; max-height: 100%; display: flex;
                         flex-direction: column; align-items: center; gap: 14px; }
        .viewer img, .viewer video { max-width: 100%; max-height: 78vh;
                                     width: auto; height: auto; display: block; }
        .viewer figcaption { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap;
                             justify-content: center; }
        .viewer .count { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); }
        .viewer .nav { position: fixed; top: 50%; transform: translateY(-50%);
                       appearance: none; background: none; border: 0; cursor: pointer;
                       color: var(--fg); padding: 20px 14px; opacity: 0.45;
                       transition: opacity 0.2s; }
        .viewer .nav:hover { opacity: 1; }
        .viewer .nav svg { width: 22px; height: 22px; fill: none;
                           stroke: currentColor; stroke-width: 1.6; }
        .viewer .prev { left: clamp(2px, 1.5vw, 24px); }
        .viewer .next { right: clamp(2px, 1.5vw, 24px); }
        .viewer .shut { position: fixed; top: 13px; right: 15px; z-index: 410;
                        appearance: none; background: none; border: 0; cursor: pointer;
                        color: var(--fg); padding: 8px; }
        .viewer .shut svg { width: 20px; height: 20px; fill: none;
                            stroke: currentColor; stroke-width: 1.6; }
        @media (max-width: 620px) { .viewer .nav { display: none; } }
    </style>
    <!-- Must stay in <head>: moving it later reintroduces the theme flash. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("vs-theme") === "light")
            document.documentElement.classList.add("light");
        } catch (e) {}
      })();
    </script>
</head>
<body>
<div class="corner">
<button class="themetoggle" type="button" aria-label="Switch to light" aria-pressed="false">
<svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
<svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<a class="mailmark" href="mailto:gregor.art@pm.me?subject=Visuospatials" aria-label="Email">
<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="1.5"/><path d="M3 6.5l9 6.5 9-6.5"/></svg>
</a>
</div>
<a class="backmark" href="/" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4M11 5l-7 7 7 7"/></svg></a>
<a class="homemark" href="/" aria-label="Front page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.6 12 3l9 7.6"/><path d="M5.6 9.6V20.2h12.8V9.6"/></svg></a>
    <header>
        <h1>Work<em>.</em></h1>
    </header>

    <div class="grid" id="grid"></div>

    <p class="tag label">Motion &amp; stills</p>

    <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Viewer">
        <button class="shut" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
        <button class="nav prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg></button>
        <figure><div class="slot"></div><figcaption><span class="t"></span><span class="m label"></span></figcaption></figure>
        <button class="nav next" type="button" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg></button>
        <p class="count label"></p>
    </div>

<nav class="exit">
    <a href="/">Visuospatials</a><a href="/studio.html">Studio/About</a><a href="/lab/">Lab</a>
    <span class="here">Work</span>
    <span class="spacer"></span>
    <span class="copy">&copy; 2026 Visuospatials</span>
</nav>
<script src="pieces.js"></script>
<script src="/nav.js"></script>
<script src="/theme.js"></script>
<script>
const grid = document.getElementById('grid');
const viewer = document.getElementById('viewer');
const slot = viewer.querySelector('.slot');
const capT = viewer.querySelector('figcaption .t');
const capM = viewer.querySelector('figcaption .m');
const count = viewer.querySelector('.count');
const isVideo = p => /\.(mp4|webm|mov)$/i.test(p.src);
let at = 0;
let opener = null;

function media(p, big) {
    if (isVideo(p)) {
        const v = document.createElement('video');
        v.src = p.src;
        v.muted = true;
        v.loop = true;
        v.playsInline = true;
        v.autoplay = !big;
        v.controls = !!big;
        if (p.poster) v.poster = p.poster;
        if (p.w && p.h) { v.width = p.w; v.height = p.h; }
        return v;
    }
    const i = document.createElement('img');
    i.src = p.src;
    i.alt = p.title || '';
    i.loading = 'lazy';
    i.decoding = 'async';
    if (p.w && p.h) { i.width = p.w; i.height = p.h; }
    return i;
}

function build() {
    if (!PIECES.length) {
        grid.className = 'empty label';
        grid.innerHTML = 'Nothing is up here yet. Everything so far lives on ' +
            '<a href="https://instagram.com/visuospatials" rel="me noopener" target="_blank">instagram</a>, ' +
            'and it moves over here as it is finished.';
        return;
    }
    PIECES.forEach((p, n) => {
        const el = document.createElement(p.link ? 'a' : 'button');
        el.className = 'piece';
        if (p.link) { el.href = p.link; el.rel = 'noopener'; el.target = '_blank'; }
        else { el.type = 'button'; el.addEventListener('click', () => open(n)); }

        const shot = document.createElement('div');
        shot.className = 'shot';
        shot.appendChild(media(p, false));

        const cap = document.createElement('div');
        cap.className = 'cap';
        cap.innerHTML = '<span class="t"></span><span class="m"></span>';
        cap.querySelector('.t').textContent = p.title || '';
        cap.querySelector('.m').textContent = p.meta || '';

        el.append(shot, cap);
        grid.appendChild(el);
    });
}

function open(n) {
    if (!viewer.classList.contains('on')) opener = document.activeElement;
    at = (n + PIECES.length) % PIECES.length;
    const p = PIECES[at];
    slot.replaceChildren(media(p, true));
    capT.textContent = p.title || '';
    capM.textContent = p.meta || '';
    count.textContent = String(at + 1).padStart(2, '0') + ' / ' + String(PIECES.length).padStart(2, '0');
    viewer.classList.add('on');
    viewer.querySelector('.shut').focus();
    // One entry per visit to the viewer, so a phone's back gesture closes it.
    if (!(history.state && history.state.viewer)) history.pushState({ viewer: true }, '');
}
function closeViewer() {
    viewer.classList.remove('on');
    slot.replaceChildren();
    if (opener && opener.focus) opener.focus();
}
function shut() {
    if (!viewer.classList.contains('on')) return;
    closeViewer();
    if (history.state && history.state.viewer) history.back();
}
addEventListener('popstate', () => { if (viewer.classList.contains('on')) closeViewer(); });
if (history.state && history.state.viewer) history.replaceState(null, '');

viewer.querySelector('.shut').addEventListener('click', shut);
viewer.querySelector('.prev').addEventListener('click', () => open(at - 1));
viewer.querySelector('.next').addEventListener('click', () => open(at + 1));
viewer.addEventListener('click', e => { if (e.target === viewer) shut(); });

document.addEventListener('keydown', e => {
    if (!viewer.classList.contains('on')) return;
    if (e.key === 'Escape') shut();
    if (e.key === 'ArrowLeft') open(at - 1);
    if (e.key === 'ArrowRight') open(at + 1);
});

build();
</script>
</body>
</html>
